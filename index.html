<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>Momentum Cards</title>
<style>
:root{--bg:#08080a;--fg:#f5f5f7;--muted:#a1a1a6;--pad:clamp(20px,4vw,64px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans KR",sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.top{position:fixed;z-index:30;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);font-size:11px;letter-spacing:.14em;background:linear-gradient(#08080add,transparent);pointer-events:none}
.muted{color:var(--muted)}
.end{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:12vh var(--pad);max-width:1300px;margin:auto}
.end h2{margin:0;max-width:980px;font-size:clamp(54px,9vw,132px);line-height:.93;letter-spacing:-.06em}
.end p{max-width:600px;margin:34px 0 0;color:var(--muted);font-size:clamp(16px,1.4vw,20px);line-height:1.55}
.story{position:relative;height:700svh;background:var(--bg)}
.stage{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center;background:var(--bg)}
.deck{position:relative;width:min(1180px,92vw);height:100svh}
.card{--y:100vh;--scale:1;--opacity:0;--blur:0px;--copy-y:0px;--copy-opacity:1;position:absolute;inset:0;background:var(--bg);transform:translate3d(0,var(--y),0) scale(var(--scale));opacity:var(--opacity);filter:blur(var(--blur));will-change:transform,opacity,filter;pointer-events:none}
.art{display:none}
.c1 .art{display:block;position:absolute;z-index:1;left:50%;top:50%;width:min(92vw,82svh,900px);height:min(92vw,82svh,900px);transform:translate(-50%,-50%);background:#000 center/contain no-repeat;will-change:transform}
.c2 .art{display:block;position:absolute;z-index:1;right:2vw;top:50%;width:min(34vw,42svh,460px);height:min(34vw,42svh,460px);transform:translateY(-50%);background:transparent;will-change:transform}
.c2 .art img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
.shade{display:none}
.copy{position:absolute;z-index:2;left:clamp(10px,5vw,72px);right:clamp(10px,5vw,72px);top:50%;max-width:760px;transform:translate3d(0,calc(-50% + var(--copy-y)),0);opacity:var(--copy-opacity);will-change:transform,opacity;text-align:left}
.c1 .copy{display:none}
.c2 .copy{left:clamp(34px,5vw,76px);right:auto;top:50%;width:min(60vw,720px);max-width:none;text-align:left}
.c2 .copy h2{font-size:clamp(40px,5vw,72px);line-height:1.04;letter-spacing:-.055em;text-align:left;font-weight:750;margin:0}
.c2 .copy h2 span{display:block;white-space:nowrap}
.c3 .copy, .c4 .copy, .c5 .copy, .c6 .copy{left:clamp(28px,6vw,90px);right:clamp(28px,6vw,90px);top:18svh;bottom:11svh;width:auto;max-width:none;display:flex;flex-direction:column;transform:translate3d(0,var(--copy-y),0)}
.c3 .copy h2, .c4 .copy h2, .c5 .copy h2, .c6 .copy h2{font-size:clamp(58px,9vw,108px);line-height:1.05;letter-spacing:-.06em;font-weight:760;margin:0}
.c3 .copy .body-space{display:flex;flex:1;min-height:0;align-items:stretch;gap:clamp(18px,4vw,60px);margin-top:clamp(16px,3svh,34px)}
.c3 .copy .lecture-art{display:block;flex:0 0 min(48%,520px);width:min(48%,520px);height:100%;max-height:100%;object-fit:contain;object-position:top left}
.c3 .copy .lecture-caption{display:none}
.c3 .copy .body-placeholder{flex:1;min-width:0}
.c4 .copy .body-space{display:flex;flex:1;min-height:0;align-items:center;justify-content:center;margin-top:clamp(18px,4svh,36px)}
.c4 .copy .prize-art{display:block;width:min(78vw,74svh,980px);max-width:100%;height:auto;max-height:100%;object-fit:contain}
.c5 .copy .part-subtitle{margin:18px 0 0;font-size:clamp(24px,3vw,34px);line-height:1.15;letter-spacing:-.035em;font-weight:700;color:var(--fg)}
.c5 .copy .body-space{display:flex;flex:1;min-height:0;align-items:center;justify-content:center;margin-top:clamp(12px,3svh,28px)}
.c5 .copy .toast-art{display:block;width:min(80vw,62svh,620px);max-width:100%;height:auto;max-height:100%;object-fit:contain}
.c6 .copy .part-subtitle{margin:18px 0 0;font-size:clamp(24px,3vw,34px);line-height:1.15;letter-spacing:-.035em;font-weight:700;color:var(--fg)}
.c6 .copy .body-space{display:flex;flex:1;min-height:0;align-items:center;justify-content:center;margin-top:clamp(12px,3svh,28px)}
.c6 .copy .watch-art{display:block;width:min(70vw,59svh,640px);max-width:100%;height:auto;max-height:100%;object-fit:contain}


.num{margin:0 0 14px;font-size:11px;font-weight:700;letter-spacing:.14em;color:#ffffff9a}
.copy h2{margin:0;font-size:clamp(38px,5.8vw,82px);line-height:.98;letter-spacing:-.05em}
.copy p:last-child{margin:18px 0 0;max-width:570px;color:#ffffffa8;font-size:clamp(14px,1.5vw,18px);line-height:1.5}
.progress{position:absolute;z-index:10;left:50%;bottom:34px;width:min(220px,38vw);height:2px;transform:translateX(-50%);background:#ffffff22;border-radius:99px;overflow:hidden}
.progress span{display:block;width:100%;height:100%;background:#fff;transform:scaleX(0);transform-origin:left;will-change:transform}
.dots{position:absolute;z-index:11;right:var(--pad);bottom:24px;display:flex;gap:6px}
.dot{width:22px;height:22px;border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer}
.dot:before{content:"";width:5px;height:5px;border-radius:50%;background:#ffffff55;transition:transform .25s ease,background .25s ease}
.dot.active:before{background:#fff;transform:scale(1.65)}
@media(max-width:700px){
  .top span{display:none}
  .deck{width:100vw}
  .c1 .art{top:49%;width:min(96vw,78svh);height:min(96vw,78svh)}
  .copy{left:9vw;right:7vw;top:50%}
  .c2 .copy{left:7vw;right:5vw;top:16svh;width:auto;transform:translate3d(0,var(--copy-y),0)}
  .c2 .copy h2{font-size:clamp(29px,8vw,40px);line-height:1.08;letter-spacing:-.045em}
  .c2 .art{left:50%;right:auto;top:58svh;bottom:auto;width:min(82vw,38svh);height:min(82vw,38svh);transform:translate(-50%,-50%)}
  .c3 .copy, .c4 .copy, .c5 .copy, .c6 .copy{left:7vw;right:7vw;top:17svh;bottom:11svh}
  .c3 .copy h2, .c4 .copy h2, .c5 .copy h2, .c6 .copy h2{font-size:clamp(60px,16vw,82px)}
  .c3 .copy .body-space{flex-direction:column;align-items:flex-start;gap:0;min-height:0;margin-top:clamp(16px,3svh,28px)}
  .c3 .copy .lecture-art{flex:0 0 auto;width:min(76vw,45svh);height:auto;max-height:min(50svh,440px);object-fit:contain;object-position:top left}
  .c3 .copy .lecture-caption{display:block;align-self:flex-start;margin:12px 0 0;font-size:25px;line-height:1.05;font-weight:760;letter-spacing:-.06em;color:var(--fg)}
  .c3 .copy .body-placeholder{flex:1;min-height:12svh}
  .c4 .copy .body-space{margin-top:clamp(20px,4svh,32px);align-items:flex-start;justify-content:center}
  .c4 .copy .prize-art{width:min(88vw,54svh);max-height:min(56svh,500px)}
  .c5 .copy .part-subtitle{margin-top:12px;font-size:25px}
  .c5 .copy .body-space{margin-top:clamp(16px,3svh,30px);align-items:center;justify-content:center}
  .c5 .copy .toast-art{width:min(92vw,58svh);max-height:59svh}
  .c6 .copy h2{font-size:clamp(39px,10.5vw,54px);white-space:nowrap}
  .c6 .copy .part-subtitle{margin-top:12px;font-size:25px}
  .c6 .copy .body-space{margin-top:clamp(14px,3svh,28px);align-items:center;justify-content:center}
  .c6 .copy .watch-art{width:min(80vw,53svh);max-height:54svh}


  .copy h2{font-size:clamp(36px,10.4vw,54px)}
  .progress{left:var(--pad);transform:none;width:110px}
  .dots{right:var(--pad)}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{filter:none!important}}
</style>
</head>
<body>
<div class="top"><b>MOMENTUM</b><span class="muted">SCROLL TO EXPLORE</span></div>
<section class="story" id="story">
  <div class="stage" id="stage">
    <div class="deck" id="deck">
      <article class="card c1"><div class="art" role="img" aria-label="2026년 신소재의 밤"></div><div class="shade"></div><div class="copy"><p class="num">01 · BEGIN</p><h2>첫 문장은<br>천천히 등장합니다.</h2><p>텍스트가 화면 위에 떠오르듯 자연스럽게 이어집니다.</p></div></article>
      <article class="card c2"><div class="art"><img src="assets/card2.webp" alt="축하 이모지 이미지"></div><div class="shade"></div><div class="copy"><h2><span>2026년</span><span>신소재의 밤에 오신</span><span>여러분을 환영합니다.</span></h2></div></article>
      <article class="card c3"><div class="art"></div><div class="shade"></div><div class="copy"><h2>1부</h2><div class="body-space"><img class="lecture-art" src="assets/card3-lecture.webp" alt="교수님이 발표 자료를 설명하는 강연 일러스트"><p class="lecture-caption">졸업생 및 교수님 강연</p><div class="body-placeholder" aria-hidden="true"></div></div></div></article>
      <article class="card c4"><div class="art"></div><div class="shade"></div><div class="copy"><h2>1부 상품</h2><div class="body-space"><img class="prize-art" src="assets/card4-prize.webp" alt="기프티콘 상품 이미지"></div></div></article>
      <article class="card c5"><div class="art"></div><div class="shade"></div><div class="copy"><h2>2부</h2><p class="part-subtitle">뒷풀이 회식</p><div class="body-space"><img class="toast-art" src="assets/card5-toast.svg" alt="두 잔이 부딪히며 반짝이는 건배 애니메이션"></div></div></article>
      <article class="card c6"><div class="art"></div><div class="shade"></div><div class="copy"><h2>2부 상품 (1)</h2><p class="part-subtitle">애플워치</p><div class="body-space"><img class="watch-art" src="assets/card6-watch.webp" alt="애플워치 상품 이미지"></div></div></article>
    </div>
    <div class="progress"><span id="bar"></span></div>
    <div class="dots" id="dots"></div>
  </div>
</section>
<section class="end"><p class="muted">READY TO EXTEND</p><h2>이제 콘텐츠만<br>바꾸면 됩니다.</h2><p>이미지와 문구, 장면 수만 바꿔도 같은 세로 전환 구조를 그대로 사용할 수 있습니다.</p></section>
<script>
(()=>{
  const story=document.querySelector('#story');
  const cards=[...document.querySelectorAll('.card')];
  const artwork=document.querySelector('.c1 .art');
  const bar=document.querySelector('#bar');
  const dots=document.querySelector('#dots');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const ease=t=>1-Math.pow(1-clamp(t),3);
  let active=0;
  let targetProgress=0;
  let smoothProgress=0;
  let travel=1;

  Promise.all([1,2,3,4,5,6].map(i=>
    fetch(`assets/card1.b64.${i}`,{cache:'no-store'}).then(r=>{
      if(!r.ok)throw new Error(`artwork part ${i}: ${r.status}`);
      return r.text();
    })
  )).then(parts=>{
    const data=parts.join('').replace(/\s/g,'');
    artwork.style.backgroundImage=`url("data:image/jpeg;base64,${data}")`;
  }).catch(err=>{
    console.error('Artwork 1 load failed',err);
    artwork.style.backgroundImage='none';
  });

  cards.forEach((_,i)=>{
    const d=document.createElement('button');
    d.className='dot';
    d.setAttribute('aria-label',`${i+1}번 장면으로 이동`);
    d.addEventListener('click',()=>go(i));
    dots.appendChild(d);
  });
  const dotList=[...dots.children];

  function measure(){
    travel=Math.max(innerHeight*3.2,(cards.length-1)*innerHeight*1.05);
    story.style.height=`${travel+innerHeight}px`;
    updateTarget();
  }

  function storyProgress(){
    const top=story.getBoundingClientRect().top;
    return clamp(-top/travel);
  }

  function updateTarget(){targetProgress=storyProgress()}

  function paint(p){
    const maxIndex=cards.length-1;
    const timeline=p*maxIndex;
    const base=Math.min(Math.floor(timeline),maxIndex);
    const local=timeline-base;
    const next=Math.min(base+1,maxIndex);

    cards.forEach((card,i)=>{
      let y=105,scale=.985,opacity=0,blur=0,copyY=42,copyOpacity=0,z=0;
      if(i<base){y=-18;scale=.99;opacity=0;blur=reduce?0:1.5;copyY=-48;z=1}
      if(i===base){const t=ease(local);y=-18*t;scale=1-.01*t;opacity=1-t;blur=reduce?0:1.1*t;copyY=-48*t;copyOpacity=1-t*.92;z=3}
      if(i===next&&next!==base){const t=ease(local);y=105*(1-t);scale=.985+.015*t;opacity=clamp(t*1.24);blur=reduce?0:1.8*(1-t);copyY=42*(1-t);copyOpacity=clamp((t-.05)/.95);z=4}
      if(base===maxIndex&&i===maxIndex){y=0;scale=1;opacity=1;blur=0;copyY=0;copyOpacity=1;z=4}
      card.style.setProperty('--y',`${y}vh`);card.style.setProperty('--scale',scale.toFixed(4));card.style.setProperty('--opacity',opacity.toFixed(4));card.style.setProperty('--blur',`${blur.toFixed(2)}px`);card.style.setProperty('--copy-y',`${copyY.toFixed(2)}px`);card.style.setProperty('--copy-opacity',copyOpacity.toFixed(4));card.style.zIndex=z;
    });
    active=clamp(Math.round(timeline),0,maxIndex);dotList.forEach((d,i)=>d.classList.toggle('active',i===active));bar.style.transform=`scaleX(${p})`;
  }

  function render(){if(reduce){smoothProgress=targetProgress}else{smoothProgress+=(targetProgress-smoothProgress)*.115;if(Math.abs(targetProgress-smoothProgress)<.00015)smoothProgress=targetProgress}paint(smoothProgress);requestAnimationFrame(render)}
  function go(i){const p=i/Math.max(1,cards.length-1);const storyTop=scrollY+story.getBoundingClientRect().top;scrollTo({top:storyTop+p*travel,behavior:reduce?'auto':'smooth'})}
  addEventListener('scroll',updateTarget,{passive:true});addEventListener('resize',measure);addEventListener('keydown',e=>{if(e.key==='ArrowDown')go(Math.min(cards.length-1,active+1));if(e.key==='ArrowUp')go(Math.max(0,active-1))});
  measure();paint(0);render();
})();
</script>
</body>
</html>
