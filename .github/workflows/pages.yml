name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare and validate artwork
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          cat assets/card1.b64.2a assets/card1.b64.2b > _site/assets/card1.b64.2
          cat assets/card1.b64.3a assets/card1.b64.3b > _site/assets/card1.b64.3
          cat _site/assets/card1.b64.1 _site/assets/card1.b64.2 _site/assets/card1.b64.3 _site/assets/card1.b64.4 _site/assets/card1.b64.5 _site/assets/card1.b64.6 > _site/assets/card1.complete.b64
          test "$(wc -c < _site/assets/card1.complete.b64)" -eq 39756
          echo "1f92157f90d83d09d128d663d5de813fbead9403658826ad37123f526ccca4ee  _site/assets/card1.complete.b64" | sha256sum -c -
          base64 --decode _site/assets/card1.complete.b64 > _site/assets/card1.jpg
          echo "f733b35d2d38f1f23fd00e2ca8d07f7ad1b9380887ac77f5b0e38d748cba7048  _site/assets/card1.jpg" | sha256sum -c -
          sed -i 's#</style>#.c1 .copy{display:none!important}</style>#' _site/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          replacement = '<article class="card c2"><div class="art"></div><div class="shade"></div><div class="copy"><h2>2026년 신소재의 밤에 오신 여러분을 환영합니다.</h2></div></article>'
          s = re.sub(r'<article class="card c2">.*?</article>', replacement, s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
