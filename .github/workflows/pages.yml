name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare and validate artwork
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          cat assets/card1.b64.2a assets/card1.b64.2b > _site/assets/card1.b64.2
          cat assets/card1.b64.3a assets/card1.b64.3b > _site/assets/card1.b64.3
          cat _site/assets/card1.b64.1 _site/assets/card1.b64.2 _site/assets/card1.b64.3 _site/assets/card1.b64.4 _site/assets/card1.b64.5 _site/assets/card1.b64.6 > _site/assets/card1.complete.b64
          test "$(wc -c < _site/assets/card1.complete.b64)" -eq 39756
          echo "1f92157f90d83d09d128d663d5de813fbead9403658826ad37123f526ccca4ee  _site/assets/card1.complete.b64" | sha256sum -c -
          base64 --decode _site/assets/card1.complete.b64 > _site/assets/card1.jpg
          echo "f733b35d2d38f1f23fd00e2ca8d07f7ad1b9380887ac77f5b0e38d748cba7048  _site/assets/card1.jpg" | sha256sum -c -

          cat assets/card2tiny.b64.0 assets/card2tiny.b64.1 assets/card2tiny.b64.2 assets/card2tiny.b64.3 assets/card2tiny.b64.4 > _site/assets/card2.small.b64
          test "$(wc -c < _site/assets/card2.small.b64)" -eq 18680
          echo "d3ae6ebae043d7c26d854bf00c31ac233c6faa458206feac6e8601057c45d4be  _site/assets/card2.small.b64" | sha256sum -c -
          base64 --decode _site/assets/card2.small.b64 > _site/assets/card2.webp
          echo "58abebe1a632a98ef76ef05a404926428b4f2168346a5c25eaae2254f5a68d13  _site/assets/card2.webp" | sha256sum -c -

          sed -i 's#</style>#.c1 .copy{display:none!important}</style>#' _site/index.html

      - name: Set up renderer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render rotating AirPods
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1-mesa-dri ffmpeg
          python -m pip install numpy Pillow moderngl scipy scikit-image
          python tools/render_airpods.py _site/assets
          rm -rf _site/tools

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
