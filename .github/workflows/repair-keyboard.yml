name: Repair keyboard preview MP4 (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-keyboard.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout original artwork
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare encoder
        run: |
          python -m pip install Pillow
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          command -v ffprobe
      - name: Render a constant-frame-rate keyboard loop
        run: |
          python - <<'PY'
          from PIL import Image
          from bisect import bisect_right
          from pathlib import Path
          import math
          src=Path("assets/card6-keyboard-3d-v1.webp")
          frames=Path("/tmp/keyboard_frames")
          frames.mkdir(exist_ok=True)
          with Image.open(src) as im:
              count=im.n_frames
              timestamps=[0]
              for i in range(count):
                  im.seek(i)
                  duration=int(im.info.get("duration") or 33)
                  timestamps.append(timestamps[-1]+max(10,duration))
              total_ms=timestamps[-1]
              fps=30
              out_count=max(2,round(total_ms*fps/1000))
              cached_index=-1
              cached_frame=None
              for i in range(out_count):
                  time_ms=(i+0.5)*1000/fps
                  frame_index=min(count-1,bisect_right(timestamps,time_ms)-1)
                  if frame_index!=cached_index:
                      im.seek(frame_index)
                      foreground=im.convert("RGBA")
                      background=Image.new("RGBA",foreground.size,(8,8,10,255))
                      background.alpha_composite(foreground)
                      cached_frame=background.convert("RGB")
                      cached_index=frame_index
                  cached_frame.save(frames/f"{i:05d}.png",compress_level=1)
              print(f"Source frames: {count}; duration: {total_ms}ms; output frames: {out_count} at 30fps")
              assert 12<=out_count<=1200 and 200<=im.width<=1280 and 200<=im.height<=1280
          PY
          ffmpeg -hide_banner -loglevel error -y -framerate 30 -i /tmp/keyboard_frames/%05d.png -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p -profile:v high -level 3.1 -g 30 -movflags +faststart -an assets/card6-keyboard-3d-v2.mp4
      - name: Verify file integrity and iPhone-compatible format
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,profile,width,height,avg_frame_rate,nb_frames -show_entries format=duration,size -of json assets/card6-keyboard-3d-v2.mp4
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path("assets/card6-keyboard-3d-v2.mp4")
          raw=p.read_bytes()
          info=json.loads(subprocess.check_output(["ffprobe","-v","quiet","-print_format","json","-show_streams","-show_format",str(p)]))
          video=next(x for x in info["streams"] if x["codec_type"]=="video")
          assert video["codec_name"]=="h264",video
          assert video["pix_fmt"]=="yuv420p",video
          assert video["avg_frame_rate"]=="30/1",video
          assert int(video.get("nb_frames","0"))>10,video
          assert 0<raw.find(b"moov")<raw.find(b"mdat"),"No faststart MP4 metadata"
          assert len(raw)<10*1024*1024
          print("Keyboard MP4 verified:",len(raw),"bytes")
          PY
      - name: Commit corrected MP4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card6-keyboard-3d-v2.mp4
          git commit -m "Add verified 30fps H.264 keyboard animation for iPhone"
          git push origin HEAD:main
